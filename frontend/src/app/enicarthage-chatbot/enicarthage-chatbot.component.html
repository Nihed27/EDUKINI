<div class="page-header">
  <div class="header-left">
    <div class="bot-avatar">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v4M12 16h.01"/>
      </svg>
    </div>
    <div>
      <h1 class="page-title">Assistant ENICarthage</h1>
      <div class="online-status">
        <span class="dot"></span>
        En ligne — spécialiste des spécialités ENICarthage
      </div>
    </div>
  </div>
</div>

<div class="chat-container">

  <!-- Zone messages -->
  <div class="messages-zone">

    <div *ngFor="let m of messages" [class]="'msg-row ' + m.role">
      <div class="bubble-wrap">
        <div *ngIf="m.role === 'bot'" class="msg-avatar">IA</div>
        <div class="bubble" [innerHTML]="formatMessage(m.text)"></div>
      </div>
      <div class="msg-time" [class]="m.role">{{ m.time }}</div>
    </div>

    <!-- Typing indicator -->
    <div class="msg-row bot" *ngIf="isTyping">
      <div class="bubble-wrap">
        <div class="msg-avatar">IA</div>
        <div class="bubble typing">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div #messagesEnd></div>
  </div>

  <!-- Suggestions -->
  <div class="suggestions" *ngIf="messages.length <= 2">
    <div class="suggestions-label">Questions fréquentes :</div>
    <div class="suggestions-grid">
      <button class="suggestion-btn" *ngFor="let s of suggestions" (click)="sendSuggestion(s)">
        {{ s }}
      </button>
    </div>
  </div>

  <!-- Input -->
  <div class="input-zone">
    <div class="input-wrap">
      <textarea
        [(ngModel)]="question"
        (keydown)="onKeyDown($event)"
        placeholder="Posez votre question sur ENICarthage, les spécialités, les débouchés..."
        rows="1"
        class="chat-input">
      </textarea>
      <button class="send-btn" (click)="sendMessage()" [disabled]="!question.trim()">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Appuyez sur Entrée pour envoyer · Ce chatbot répond uniquement aux questions sur ENICarthage</div>
  </div>

</div>
