<div class="page-header">
  <h1 class="page-title">Spécialités de la filière</h1>
  <p class="page-sub">Découvrez les différentes spécialités proposées, leurs matières clés et leurs débouchés.</p>
</div>

<div class="reco-list">
  <div class="reco-card" *ngFor="let s of specialites" style="border-left: 5px solid #7c3aed;">

    <div class="reco-header">
      <div class="reco-title-block">
        <div class="reco-sigle">{{ s.sigle }}</div>
        <div class="reco-nom">{{ s.nom }}</div>
      </div>
    </div>

    <div class="reco-desc">{{ s.description }}</div>

    <div class="reco-meta" style="margin-top: 1.5rem">
      <div class="meta-block">
        <div class="meta-label">Matières clés</div>
        <div class="tags">
          <span class="tag" *ngFor="let m of s.matieresCles">{{ m }}</span>
        </div>
      </div>
      <div class="meta-block">
        <div class="meta-label">Débouchés</div>
        <div class="tags">
          <span class="tag green" *ngFor="let d of s.debouches">{{ d }}</span>
        </div>
      </div>
    </div>

  </div>
</div>
