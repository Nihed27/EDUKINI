<div class="page">
  <div class="card">
    <div class="logo">Edukini</div>
    <div class="subtitle">Réinitialiser votre mot de passe</div>

    <div class="field">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="email@etudiant.tn" />
    </div>

    <div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>
    <div class="success" *ngIf="successMsg">{{ successMsg }}</div>

    <button type="button" class="btn-submit" (click)="submit()">
      Envoyer le lien de réinitialisation
    </button>

    <div class="back-link">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </div>
</div>
