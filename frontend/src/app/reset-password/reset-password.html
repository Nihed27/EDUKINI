<div class="page">
  <div class="card">
    <div class="logo">Edukini</div>
    <div class="subtitle">Choisir un nouveau mot de passe</div>

    <div class="field">
      <label>Nouveau mot de passe</label>
      <input type="password" [(ngModel)]="newPassword" placeholder="Nouveau mot de passe" />
    </div>

    <div class="field">
      <label>Confirmer mot de passe</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirmer mot de passe" />
    </div>

    <div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>
    <div class="success" *ngIf="successMsg">{{ successMsg }}</div>

    <button type="button" class="btn-submit" (click)="submit()">
      Réinitialiser le mot de passe
    </button>

    <div class="back-link">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </div>
</div>
