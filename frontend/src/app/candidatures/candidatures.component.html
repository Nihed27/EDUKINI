<div class="page-header">
  <h1 class="page-title">Mes Candidatures</h1>
</div>

<div class="page-body">

  <div class="empty-state" *ngIf="candidatures.length === 0">
    <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="#2563eb" stroke-width="1.5">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
    <div class="empty-title">Aucune candidature</div>
    <div class="empty-sub">Consultez les recommandations pour postuler aux spécialités</div>
  </div>

  <div class="cand-list" *ngIf="candidatures.length > 0">
    <div class="cand-card" *ngFor="let c of candidatures">
      <div class="cand-left">
        <div class="cand-filiere">{{ c.filiere }}</div>
        <div class="cand-ecole">{{ c.ecole }}</div>
        <div class="cand-date">Postulé le {{ c.date }}</div>
      </div>
      <span [class]="'statut-tag statut-' + c.statut">{{ getStatutLabel(c.statut) }}</span>
    </div>
  </div>

</div>
