<div class="page-header">
  <h1 class="page-title">Notifications</h1>
  <p class="page-sub">{{ nonLus }} non lue(s) · {{ notifications.length }} au total</p>
</div>

<div class="notif-list">
  <div class="notif-card" *ngFor="let n of notifications"
       [class.non-lu]="!n.lu" (click)="marquerLu(n)">

    <div [class]="'notif-icon icon-' + n.type">
      <svg *ngIf="n.type === 'info'" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <svg *ngIf="n.type === 'success'" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <svg *ngIf="n.type === 'warning'" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>

    <div class="notif-body">
      <div class="notif-titre">{{ n.titre }}</div>
      <div class="notif-msg">{{ n.message }}</div>
      <div class="notif-date">{{ n.date }}</div>
    </div>

    <div class="notif-dot" *ngIf="!n.lu"></div>
  </div>
</div>
