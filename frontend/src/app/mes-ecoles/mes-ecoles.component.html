<div class="page-header">
  <h1 class="page-title">Mes Écoles</h1>
</div>

<div class="page-body">
  <div class="ecoles-grid">
    <div class="ecole-card" *ngFor="let e of ecoles">
      <div class="ecole-header">
        <div class="ecole-sigle">{{ e.sigle }}</div>
        <span class="ecole-ville">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          {{ e.ville }}
        </span>
      </div>
      <div class="ecole-nom">{{ e.nom }}</div>
      <div class="ecole-desc">{{ e.description }}</div>
      <button class="detail-btn">Voir les détails</button>
    </div>
  </div>
</div>
