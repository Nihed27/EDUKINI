<div class="page-header">
  <h1 class="page-title">Mon Profil Académique</h1>
</div>

<div class="page-body">

  <!-- 🔽 FILIERE -->
  <div class="section-card">
    <div class="section-title">Choisir la filière</div>
 <!-- ✅ LABEL ACCESSIBLE -->
  <label for="filiereSelect" class="form-label">
    Filière
  </label>
    <select id="filiereSelect" [(ngModel)]="filiere">
      <option value="informatique">Informatique</option>
      <option value="infotronique">Infotronique</option>
      <option value="mecathronique">Mécatronique</option>
      <option value="industriel">Industriel</option>
    </select>
  </div>

  <!-- 📊 SEMESTRE + MOYENNE -->
  <div class="section-card">

    <div class="tabs">
      <button
        [class.active]="semestre === 'S1'"
        (click)="semestre='S1'">
        Semestre 1
      </button>

      <button
        [class.active]="semestre === 'S2'"
        (click)="semestre='S2'">
        Semestre 2
      </button>

      <div class="moyenne">
        Moyenne : {{ moyenne }}/20
      </div>
    </div>

  </div>

  <!-- 📚 NOTES PAR UE -->
  <div
    class="section-card"
    *ngFor="let ue of notesActuelles">

    <div class="section-title">
      {{ ue.ue }}
    </div>

    <div
      class="note-row"
      *ngFor="let item of ue.matieres">

      <!-- Matière -->
      <div class="note-matiere">
        {{ item.matiere }}
      </div>

      <!-- Input -->
      <input
        class="note-input"
        type="number"
        [(ngModel)]="item.note"
        (ngModelChange)="validerNote(item)"
        min="0"
        max="20"
        step="0.25"
        placeholder="—"
      />

      <!-- Barre -->
      <div class="note-bar-bg">
        <div
          class="note-bar-fill"
          [style.width.%]="barreWidth(item.note)"
          [style.background]="couleurBarre(item.note)">
        </div>
      </div>

      <!-- Supprimer -->
      <button
        class="btn-delete"
        (click)="supprimerNote(item)"
        title="Supprimer la note">
        ✕
      </button>

    </div>
  </div>

  <!-- 🤖 IA -->
  <div class="section-card ia">
    🤖 Recommandation IA basée sur vos notes (bientôt disponible)
  </div>

  <!-- ⚙️ ACTIONS -->
  <div class="actions">

    <button
      class="btn-secondary"
      (click)="toutEffacer()">
      Tout effacer
    </button>

    <button
      class="btn-primary"
      (click)="sauvegarder()">
      Sauvegarder
    </button>

  </div>

  <!-- ✅ MESSAGE -->
  <div
    class="success-msg"
    *ngIf="messageSucces">
    {{ messageSucces }}
  </div>

</div>
