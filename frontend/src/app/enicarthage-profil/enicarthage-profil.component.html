<div class="page-header">
  <h1 class="page-title">Mon Profil Académique</h1>
  <p class="page-sub">Complétez vos informations pour obtenir des recommandations personnalisées</p>
</div>

<div class="page-body">

  <div class="section-card">
    <div class="section-title">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#22c55e" stroke-width="2">
        <polyline points="9 11 12 14 22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      Notes du semestre
      <span class="moyenne-badge">Moyenne : {{ moyenne }}/20</span>
    </div>

    <div class="notes-grid">
      <div class="note-row" *ngFor="let n of notes">
        <div class="note-matiere">{{ n.matiere }}</div>
        <div class="note-input-wrap">
          <input type="number" [(ngModel)]="n.note" min="0" max="20" class="note-input" />
          <span class="note-suffix">/20</span>
        </div>
        <div class="note-bar-bg">
          <div class="note-bar-fill"
               [style.width.%]="(n.note / 20) * 100"
               [class]="n.note >= 14 ? 'fill-green' : n.note >= 10 ? 'fill-blue' : 'fill-red'">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#2563eb" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/>
        <line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
      Mes préférences
    </div>

    <div class="pref-grid">
      <div class="pref-group">
        <label>Domaine préféré</label>
        <select [(ngModel)]="preferences.domainePrefer">
          <option value="logiciel">Développement logiciel</option>
          <option value="reseaux">Réseaux et sécurité</option>
          <option value="electronique">Électronique embarquée</option>
          <option value="indecis">Je ne sais pas encore</option>
        </select>
      </div>
      <div class="pref-group">
        <label>Type de travail préféré</label>
        <select [(ngModel)]="preferences.travailPrefer">
          <option value="conception">Conception et architecture</option>
          <option value="developpement">Développement et code</option>
          <option value="gestion">Gestion de projet</option>
          <option value="recherche">Recherche et innovation</option>
        </select>
      </div>
      <div class="pref-group">
        <label>Objectif après diplôme</label>
        <select [(ngModel)]="preferences.objectif">
          <option value="entreprise">Intégrer une entreprise</option>
          <option value="startup">Créer une startup</option>
          <option value="master">Poursuivre en master</option>
          <option value="etranger">Travailler à l'étranger</option>
        </select>
      </div>
    </div>
  </div>

  <button class="save-btn" (click)="sauvegarder()">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </svg>
    Sauvegarder le profil
  </button>

  <div class="success-msg" *ngIf="messageSucces">✅ {{ messageSucces }}</div>

</div>
