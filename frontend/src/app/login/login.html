<div class="page">
  <form class="card" (ngSubmit)="onSubmit($event)" novalidate>
    <div class="logo">Edukini</div>
    <div class="subtitle">Orientation intelligente des ingénieurs</div>

    <div class="field">
      <input type="email" name="email" [(ngModel)]="email" placeholder="email@etudiant.tn" />
    </div>

    <div class="field input-eye">
      <input [type]="showPwd ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="Mot de passe" />
      <button type="button" class="eye-btn" (click)="togglePwd()" title="Afficher/masquer le mot de passe">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path *ngIf="!showPwd" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle *ngIf="!showPwd" cx="12" cy="12" r="3"/>
          <path *ngIf="showPwd" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path *ngIf="showPwd" d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line *ngIf="showPwd" x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>

<div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>


    <div class="btns">
      <button type="submit" class="btn btn-student">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Se connecter
      </button>
    </div>

    <div class="separator">
      <span>ou continuer avec</span>
    </div>

    <div class="oauth-buttons">
      <button type="button" class="oauth-btn google" (click)="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" /> Google
      </button>
    </div>

    <div class="forgot" style="margin-top: 10px;">
      Pas encore de compte ? <a routerLink="/register">S'inscrire</a>
    </div>
    <div class="forgot-password">
      <a routerLink="/forgot-password">Mot de passe oublié ?</a>
    </div>
  </form>
</div>
