<div class="page-header">
  <h1 class="page-title">Spécialités disponibles</h1>
  <p class="page-sub">ENICarthage propose 3 spécialités pour les étudiants de 2ème et 3ème année</p>
</div>

<div class="spec-list">
  <div class="spec-card" *ngFor="let s of specialites; let i = index" [class]="'spec-card border-' + s.couleur">

    <div class="spec-header" (click)="toggle(i)">
      <div class="spec-left">
        <div [class]="'spec-sigle bg-' + s.couleur">{{ s.sigle }}</div>
        <div>
          <div class="spec-nom">{{ s.nom }}</div>
          <div class="spec-meta">{{ s.places }} places · {{ s.duree }} · {{ s.langue }}</div>
        </div>
      </div>
      <svg [class]="ouvert === i ? 'chevron open' : 'chevron'" width="20" height="20"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>

    <div class="spec-body" *ngIf="ouvert === i">
      <p class="spec-desc">{{ s.description }}</p>
      <div class="spec-cols">
        <div>
          <div class="col-title">Matières enseignées</div>
          <ul class="spec-ul">
            <li *ngFor="let m of s.matieres">{{ m }}</li>
          </ul>
        </div>
        <div>
          <div class="col-title">Débouchés professionnels</div>
          <ul class="spec-ul green">
            <li *ngFor="let d of s.debouches">{{ d }}</li>
          </ul>
        </div>
      </div>
    </div>

  </div>
</div>
