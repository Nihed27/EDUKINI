<div class="page">
  <div class="card">
    <div class="logo">Edukini</div>
    <div class="subtitle">Créer votre compte</div>

    <div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>
    <div class="success" *ngIf="successMsg" style="color: #4caf50; text-align: center; margin-bottom: 10px; font-weight: 500;">{{ successMsg }}</div>

    <div class="row">
      <div class="field">
        <label>Prénom</label>
        <input type="text" [(ngModel)]="prenom" placeholder="Votre prénom" />
      </div>
      <div class="field">
        <label>Nom</label>
        <input type="text" [(ngModel)]="nom" placeholder="Votre nom" />
      </div>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="email@etudiant.tn" />
    </div>

    <div class="field">
      <label>Mot de passe</label>
      <div class="input-eye">
        <input [type]="showPwd ? 'text' : 'password'" [(ngModel)]="password" placeholder="Mot de passe" />
        <button class="eye-btn" (click)="togglePwd()" title="Afficher/masquer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path *ngIf="!showPwd" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle *ngIf="!showPwd" cx="12" cy="12" r="3"/>
            <path *ngIf="showPwd" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path *ngIf="showPwd" d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line *ngIf="showPwd" x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label>Confirmer mot de passe</label>
      <div class="input-eye">
        <input [type]="showPwd2 ? 'text' : 'password'" [(ngModel)]="confirmPassword" placeholder="Confirmer mot de passe" />
        <button class="eye-btn" (click)="togglePwd2()" title="Afficher/masquer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path *ngIf="!showPwd2" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle *ngIf="!showPwd2" cx="12" cy="12" r="3"/>
            <path *ngIf="showPwd2" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path *ngIf="showPwd2" d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line *ngIf="showPwd2" x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-submit" (click)="register()" [disabled]="loading">
      {{ loading ? 'Création...' : 'Créer mon compte' }}
    </button>

    <div class="login-link">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </div>
  </div>
</div>
